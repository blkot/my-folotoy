# 固件网页的 nginx 配置。
#
# 需要显式声明的只有两件事:
#   1. .bin 要带上正确的 Content-Type 和 CORS 头 —— 浏览器里 ESP Web Tools
#      用 fetch 拉镜像,没有这些头在跨源场景下会失败;
#   2. 关掉 .bin 的缓存,否则换了固件还刷到旧的(这类错误很难排查)。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # .bin 体积在 1.4 MB 左右,开 gzip 意义不大;但要允许大文件上传/下载。
    client_max_body_size 32m;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.bin$ {
        default_type application/octet-stream;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
    }

    # 清单/页面本身也不缓存,避免改了页面但浏览器还拿旧的。
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-store" always;
    }
}
